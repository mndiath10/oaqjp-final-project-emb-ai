<!DOCTYPE html>
<html>
<head>
    <title>Emotion Detection</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous">
    <script src="./static/mywebscript.js"></script>
    <style>
        .center-heading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="center-heading">NLP - Emotion Detection</h1>
            <div>
                <label for="textToAnalyze">Please enter the text to be analyzed</label>
                <textarea class="form-control" id="textToAnalyze" rows="4"></textarea>
                <br>
                <button onclick="RunSentimentAnalysis()" class="btn btn-primary">
                    Run Sentiment Analysis
                </button>
            </div>
            <div>
                <h2 class="center-heading">Result of Emotion Detection</h2>
                <div id="system_response"></div>
            </div>
        </div>
    </div>
</body>
</html>
